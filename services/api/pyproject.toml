[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nodo-api"
version = "0.1.0"
description = "NODO AI privacy-first meeting memory API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.159,<0.163",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2,<3",
  "PyJWT[crypto]>=2,<3",
  "httpx>=0.27",  # identity provider keys (JWKS)
  "opentelemetry-api>=1.27",  # spans and metrics; no-ops until Azure Monitor is configured
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
  "azure-servicebus>=7.13",
  "azure-search-documents>=11.6",
  "openai>=1.60",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",  # voice gateway: sessions shared between replicas
  "azure-cognitiveservices-speech>=1.40",  # voice gateway: streaming recognition and synthesis
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-psycopg>=0.48b0",
  # Floors for transitive dependencies with published fixes (found by the image scan).
  "urllib3>=2.8.0",
  "msgpack>=1.2.1",
]
# The local backend (ADR-014). "local" is what the code needs to run and be tested; "local-models"
# adds the model runtimes, which are large (PyTorch) and only needed on the user's computer.
local = [
  "numpy>=2",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "openai>=1.60",
  "httpx>=0.27",
]
local-models = [
  "nodo-api[local]",
  "faster-whisper>=1.1",
  "onnx>=1.16",  # only for tools/local-setup/export_embedding_onnx.py
  "sherpa-onnx>=1.12",
]
dev = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nodo_api.migrations" = ["*.sql"]
"nodo_api.adapters.local" = ["schema/*.sql"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nodo_api"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long SQL statements read better unbroken.
"src/nodo_api/adapters/azure/graph_pg.py" = ["E501"]
"src/nodo_api/adapters/local/*.py" = ["E501"]
"src/nodo_api/adapters/azure/retention_pg.py" = ["E501"]
"scripts/bench_*.py" = ["E501", "B023"]
# Each preflight check carries a one-sentence remedy on one line.
"src/nodo_api/preflight.py" = ["E501"]

