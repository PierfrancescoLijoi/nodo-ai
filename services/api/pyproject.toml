[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nodo-api"
version = "0.1.0"
description = "NODO AI privacy-first meeting memory API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.159,<0.160",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2,<3",
  "PyJWT[crypto]>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
  "azure-servicebus>=7.13",
  "azure-search-documents>=11.6",
  "openai>=1.60",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nodo_api.migrations" = ["*.sql"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nodo_api"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

