name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "services/api/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Nothing to deploy to until the owner has run infra/azure/setup-github-oidc.sh.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment names
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          API_APP_NAME: ${{ vars.API_APP_NAME }}
          WORKER_JOB_NAME: ${{ vars.WORKER_JOB_NAME }}
          MIGRATE_JOB_NAME: ${{ vars.MIGRATE_JOB_NAME }}
          RETENTION_JOB_NAME: ${{ vars.RETENTION_JOB_NAME }}
          # Professional tier: the jobs that check and rebuild the search index, kept on the same image.
          INDEX_VERIFY_JOB_NAME: ${{ vars.INDEX_VERIFY_JOB_NAME }}
          REINDEX_JOB_NAME: ${{ vars.REINDEX_JOB_NAME }}
          REINDEX_JOB_NAME_DR: ${{ vars.REINDEX_JOB_NAME_DR }}
          # Professional tier: the standby API (kept on the same image, or a failover would start an
          # old one), its resource group, and the public host the smoke test goes through.
          API_APP_NAME_DR: ${{ vars.API_APP_NAME_DR }}
          RESOURCE_GROUP_DR: ${{ vars.AZURE_RESOURCE_GROUP_DR }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          set -euo pipefail
          for name in RESOURCE_GROUP ACR_NAME API_APP_NAME WORKER_JOB_NAME MIGRATE_JOB_NAME; do
            if [ -z "${!name}" ]; then
              echo "Missing repository or environment variable: ${name}" >&2
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          for name in RETENTION_JOB_NAME INDEX_VERIFY_JOB_NAME REINDEX_JOB_NAME REINDEX_JOB_NAME_DR API_APP_NAME_DR RESOURCE_GROUP_DR PUBLIC_HOST; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          printf 'IMAGE=%s.azurecr.io/nodo-api:%s\n' "$ACR_NAME" "$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        run: docker buildx build --load --tag "$IMAGE" services/api

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The professional tier firewalls the registry. This runner's address is allowed for the
      # length of the job and removed again at the end, whatever happens.
      - name: Allow this runner through the registry firewall
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          echo "RUNNER_IP=${runner_ip}" >> "$GITHUB_ENV"
          if [ "$(az acr show --name "$ACR_NAME" --query networkRuleSet.defaultAction --output tsv)" = "Deny" ]; then
            az acr network-rule add --name "$ACR_NAME" --ip-address "$runner_ip"
            echo "RUNNER_RULE_ADDED=true" >> "$GITHUB_ENV"
            sleep 30
          fi

      - name: Push API image
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker push "$IMAGE"

      - name: Run database and search bootstrap
        run: |
          set -euo pipefail
          az containerapp job update \
            --name "$MIGRATE_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

          execution_name="$(az containerapp job start \
            --name "$MIGRATE_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query name \
            --output tsv)"

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status="$(az containerapp job execution show \
              --name "$MIGRATE_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status \
              --output tsv)"
            echo "Migration execution ${execution_name}: ${status}"
            case "$status" in
              Succeeded)
                exit 0
                ;;
              Failed)
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Migration execution timed out after 10 minutes" >&2
          exit 1

      - name: Deploy worker and API
        run: |
          set -euo pipefail
          az containerapp job update \
            --name "$WORKER_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
          if [ -n "${RETENTION_JOB_NAME}" ]; then
            az containerapp job update \
              --name "$RETENTION_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"
          fi
          for job in "$INDEX_VERIFY_JOB_NAME" "$REINDEX_JOB_NAME"; do
            if [ -n "$job" ]; then
              az containerapp job update --name "$job" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
            fi
          done
          if [ -n "${REINDEX_JOB_NAME_DR}" ]; then
            az containerapp job update \
              --name "$REINDEX_JOB_NAME_DR" \
              --resource-group "${RESOURCE_GROUP_DR:-$RESOURCE_GROUP}" \
              --image "$IMAGE"
          fi
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
          if [ -n "${API_APP_NAME_DR}" ]; then
            az containerapp update \
              --name "$API_APP_NAME_DR" \
              --resource-group "${RESOURCE_GROUP_DR:-$RESOURCE_GROUP}" \
              --image "$IMAGE"
          fi

      # Through the public door when there is one (edge, gateway, then the app), so a broken
      # gateway policy fails the deploy; the container app's own address otherwise.
      - name: Smoke test API
        run: |
          set -euo pipefail
          if [ -n "${PUBLIC_HOST}" ]; then
            url="https://${PUBLIC_HOST}/readyz"
          else
            fqdn="$(az containerapp show \
              --name "$API_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"
            url="https://${fqdn}/healthz"
          fi
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "$url"

      - name: Remove this runner from the registry firewall
        if: always() && env.RUNNER_RULE_ADDED == 'true'
        run: az acr network-rule remove --name "$ACR_NAME" --ip-address "$RUNNER_IP"
