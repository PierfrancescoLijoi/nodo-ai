name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python and Node versions, GPU, and whether you used the installer or source.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any private meeting content before pasting.
